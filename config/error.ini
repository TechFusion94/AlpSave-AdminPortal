; Submission settings: errors are logged (developer-readable), never shown to users.
; For local debugging, temporarily set display_errors = On.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL


; Development performance settings
;opcache.enable = 1                    ; Enable opcache for better performance
;opcache.revalidate_freq = 0           ; Always check file changes (dev only)
;max_execution_time = 300              ; Longer timeout for debugging
;memory_limit = 256M                   ; More memory for development
;upload_max_filesize = 64M             ; Larger upload size for testing
;post_max_size = 64M                   ; Matching post size

; Development specific settings
;xdebug.mode = debug                   ; Enable debugging features
;xdebug.start_with_request = yes       ; Auto-start debugging
;xdebug.client_host = host.docker.internal  ; Connect to host IDE
;session.cookie_secure = 0             ; Allow HTTP in development
